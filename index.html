        ['溶鉱炉（一酸化炭素の生成）', '溶鉱炉内で、二酸化炭素が高温の炭素に還元されて一酸化炭素になる反応式を作りなさい。', 'CO2 + C -> 2CO', 'Oが2個なのでCOを2にし、Cを1にします。'],
        ['カーバイドからのアセチレン', '炭化カルシウム（カーバイド）に水を加え、水酸化カルシウムとアセチレン(C₂H₂)を得る反応式を作りなさい。', 'CaC2 + 2H2O -> Ca(OH)2 + C2H2', 'Hの数から、水は2になります。'],

        ['水蒸気改質', 'メタンと水蒸気から、一酸化炭素と水素を得る反応式を作りなさい。', 'CH4 + H2O -> CO + 3H2', 'Hが左辺で6個になるのでH₂を3にします。水素の工業的製法です。'],
        ['水性ガスシフト反応', '一酸化炭素と水蒸気から、二酸化炭素と水素を得る反応式を作りなさい。', 'CO + H2O -> CO2 + H2', 'すべての係数が1になります。'],

        ['尿素の合成', 'アンモニアと二酸化炭素から、尿素 CO(NH2)2 と水を合成する反応式を作りなさい。', '2NH3 + CO2 -> CO(NH2)2 + H2O', 'Nが2個なのでNH₃を2に。H・Oも合います。'],
        ['ケイ素の製造', '二酸化ケイ素をコークス（炭素）で還元し、ケイ素と一酸化炭素を得る反応式を作りなさい。', 'SiO2 + 2C -> Si + 2CO', 'Oが2個なのでCOを2に、Cも2にします。'],
        ['ガラスの製造', '炭酸ナトリウムと二酸化ケイ素を高温で反応させ、ケイ酸ナトリウム(Na₂SiO₃)と二酸化炭素を得る反応式を作りなさい。', 'Na2CO3 + SiO2 -> Na2SiO3 + CO2', 'すべての係数が1になります。ソーダ石灰ガラスの原料の反応です。'],
        ['過リン酸石灰の製造', 'リン酸カルシウムに濃硫酸を作用させ、リン酸二水素カルシウム Ca(H2PO4)2 と硫酸カルシウムを得る反応式を作りなさい。', 'Ca3(PO4)2 + 2H2SO4 -> Ca(H2PO4)2 + 2CaSO4', 'Caは左辺3個なので、右辺はCa(H₂PO₄)₂が1、CaSO₄が2。Sは2個なのでH₂SO₄を2にします。'],
        ['エタノールの発酵', 'グルコースがアルコール発酵し、エタノール(C₂H₅OH)と二酸化炭素になる反応式を作りなさい。', 'C6H12O6 -> 2C2H5OH + 2CO2', 'Cが6個なので、エタノールを2、CO₂を2にするとすべて合います。'],
        ['酸化エチレンの製造', '銀触媒を用いて、エチレンを酸素で酸化し、酸化エチレン(C₂H₄O)を得る反応式を作りなさい。', '2C2H4 + O2 -> 2C2H4O', 'O₂のOが2個なので、C₂H₄Oを2に。すると、C₂H₄も2になります。']
      ]
    };

    // 反応式の文字列を {left, right} に変換
    const parseSide = (s) => s.split(' + ').map(t => {
      const m = t.trim().match(/^(\d*)(.+)$/);
      return { coeff: m[1] ? parseInt(m[1], 10) : 1, formula: m[2] };
    });
    const buildEq = (eq) => {
      const [l, r] = eq.split('->');
      return { left: parseSide(l), right: parseSide(r) };
    };
    const shuf = (a) => [...a].sort(() => Math.random() - 0.5);

    const baseQuizData = {
      beginner: RAW.beginner.map(([title, eq, explanation], i) => ({
        id: 'b' + (i + 1),
        title,
        text: `【${title}】両辺の原子の数が等しくなるように係数を合わせましょう。`,
        ...buildEq(eq),
        explanation
      })),
      intermediate: RAW.intermediate.map(([title, desc, eq, explanation, extra], i) => {
        const e = buildEq(eq);
        const names = Array.from(new Set([...e.left, ...e.right].map(t => t.formula).concat(extra)));
        return {
          id: 'i' + (i + 1),
          title,
          text: desc + '正しい化学式と係数を選択して反応式を完成させましょう。',
          ...e,
          choices: shuf(names),
          explanation
        };
      }),
      advanced: RAW.advanced.map(([title, text, eq, explanation], i) => ({
        id: 'a' + (i + 1),
        title,
        text,
        ...buildEq(eq),
        explanation
      }))
    };

    // --- ヘルパー関数 ---
    const toHalf = (str) => {
      if (!str) return "";
      return str
        .replace(/[Ａ-Ｚａ-ｚ０-９]/g, (s) => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
        .replace(/（/g, '(').replace(/）/g, ')')
        .replace(/\s+/g, '');
    };

    const fmtForm = (text) => {
      if (!text) return "";
      return text.split(/(\d+)/).map((part, i) =>
        /^\d+$/.test(part) ? <sub key={i} className="text-[0.75em]">{part}</sub> : part
      );
    };

    // 化学式の原子数を数える（括弧対応）
    const countAtoms = (formula) => {
      const stack = [{}];
      const re = /([A-Z][a-z]?)(\d*)|(\()|(\))(\d*)/g;
      let m;
      let consumed = 0;
      while ((m = re.exec(formula)) !== null) {
        consumed += m[0].length;
        if (m[1]) {
          const top = stack[stack.length - 1];
          top[m[1]] = (top[m[1]] || 0) + (m[2] ? parseInt(m[2], 10) : 1);
        } else if (m[3]) {
          stack.push({});
        } else if (m[4]) {
          if (stack.length < 2) return null;
          const grp = stack.pop();
          const mul = m[5] ? parseInt(m[5], 10) : 1;
          const top = stack[stack.length - 1];
          for (const k in grp) top[k] = (top[k] || 0) + grp[k] * mul;
        }
      }
      if (consumed !== formula.length || stack.length !== 1) return null;
      return stack[0];
    };

    // 反応式の原子数が両辺で一致するか（AI生成問題の検証用）
    const isBalanced = (left, right) => {
      const sum = (terms) => {
        const total = {};
        for (const t of terms) {
          const atoms = countAtoms(toHalf(String(t.formula)));
          const c = Number(t.coeff);
          if (!atoms || !Number.isInteger(c) || c < 1) return null;
          for (const k in atoms) total[k] = (total[k] || 0) + atoms[k] * c;
        }
        return total;
      };
      const l = sum(left), r = sum(right);
      if (!l || !r) return false;
      const keys = new Set([...Object.keys(l), ...Object.keys(r)]);
      for (const k of keys) if ((l[k] || 0) !== (r[k] || 0)) return false;
      return true;
    };

    const sanitizeAiQuestions = (arr, diff) => {
      if (!Array.isArray(arr)) return [];
      return arr.map((q, i) => {
        if (!q || !Array.isArray(q.left) || !Array.isArray(q.right)) return null;
        if (q.left.length < 1 || q.right.length < 1 || q.left.length > 4 || q.right.length > 4) return null;
        const norm = (terms) => terms.map(t => ({ formula: toHalf(String(t.formula)), coeff: Number(t.coeff) }));
        const left = norm(q.left), right = norm(q.right);
        if (!isBalanced(left, right)) return null;
        const out = {
          id: `ai${i}`,
          title: q.title || 'AI生成問題',
          text: String(q.text || ''),
          left, right,
          explanation: String(q.explanation || '')
        };
        if (diff === 'intermediate') {
          const all = [...left, ...right].map(t => t.formula);
          const extra = Array.isArray(q.choices) ? q.choices.map(c => toHalf(String(c))) : [];
          out.choices = Array.from(new Set([...all, ...extra])).sort(() => Math.random() - 0.5);
        }
        return out;
      }).filter(Boolean);
    };

    // AI生成問題を、問題データ（RAW）と同じ書式の文字列にする
    const buildExport = (qs, diff) => {
      const side = (ts) => ts.map(t => (t.coeff > 1 ? t.coeff : '') + t.formula).join(' + ');
      const esc = (s) => String(s || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\s*\n\s*/g, ' ');
      return qs.map(q => {
        const eq = `${side(q.left)} -> ${side(q.right)}`;
        if (diff === 'intermediate') {
          const used = new Set([...q.left, ...q.right].map(t => t.formula));
          const extra = (q.choices || []).filter(c => !used.has(c)).map(c => `'${esc(c)}'`).join(', ');
          return `['${esc(q.title)}', '${esc(q.text)}', '${esc(eq)}', '${esc(q.explanation)}', [${extra}]],`;
        }
        if (diff === 'advanced') return `['${esc(q.title)}', '${esc(q.text)}', '${esc(eq)}', '${esc(q.explanation)}'],`;
        return `['${esc(q.title)}', '${esc(eq)}', '${esc(q.explanation)}'],`;
      }).join('\n');
    };

    const renderEq = (leftTerms, rightTerms) => {
      const renderSide = (terms) =>
        terms.map((t, idx) => (
          <Fragment key={idx}>
            {idx > 0 && <span className="mx-1.5 text-slate-400 font-bold">+</span>}
            <span className="text-slate-800 font-bold">
              {t.coeff > 1 ? t.coeff : ''}
              {fmtForm(t.formula)}
            </span>
          </Fragment>
        ));

      return (
        <div className="flex items-center justify-center flex-wrap text-lg sm:text-xl">
          {renderSide(leftTerms)}
          <i className="fa-solid fa-arrow-right mx-3 text-teal-600"></i>
          {renderSide(rightTerms)}
        </div>
      );
    };

    // --- 各項の入力ボックス ---
    const TermInput = ({ coeff, formula, onCoeffChange, onFormulaChange, difficulty, choices, disabled }) => {
      const isBeginner = difficulty === 'beginner';
      const isAdvanced = difficulty === 'advanced';

      return (
        <div className="flex flex-col items-center bg-white p-2.5 rounded-xl shadow-sm border border-slate-200 min-w-[85px]">
          <div className="text-[10px] text-slate-400 mb-1 font-bold">
            {isBeginner ? '係数' : '係数 / 化学式'}
          </div>
          <div className="flex items-center space-x-1">
            <input
              type="number" min="1" max="99" disabled={disabled}
              className="w-11 h-10 text-center text-base font-bold border-2 border-slate-300 rounded-lg focus:border-teal-500 outline-none disabled:bg-slate-100"
              placeholder="係" value={coeff}
              onChange={(e) => onCoeffChange(e.target.value)}
            />
            {isBeginner ? (
              <div className="text-lg font-bold px-1.5 text-slate-700 min-w-[2.5rem] text-center">
                {fmtForm(formula)}
              </div>
            ) : !isAdvanced && choices ? (
              <select
                disabled={disabled}
                className="h-10 text-sm font-bold border-2 border-slate-300 rounded-lg focus:border-teal-500 outline-none px-1 bg-white disabled:bg-slate-100"
                value={formula} onChange={(e) => onFormulaChange(e.target.value)}
              >
                <option value="">選択</option>
                {choices.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            ) : (
              <input
                type="text" disabled={disabled}
                className="w-20 h-10 text-center text-base font-bold border-2 border-slate-300 rounded-lg focus:border-teal-500 outline-none disabled:bg-slate-100 placeholder:text-xs"
                placeholder="例:H2O" value={formula}
                onChange={(e) => onFormulaChange(e.target.value)}
                autoCapitalize="off" autoComplete="off" spellCheck="false"
              />
            )}
          </div>
        </div>
      );
    };

    // --- メインアプリ ---
    const App = () => {
      const [screen, setScreen] = useState('home');
      const [difficulty, setDifficulty] = useState('beginner');
      const [questions, setQuestions] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [score, setScore] = useState(0);
      const [hasAttempted, setHasAttempted] = useState(false);
      const [isLoading, setIsLoading] = useState(false);
      const [apiKey, setApiKey] = useState(loadKey());
      const [aiError, setAiError] = useState('');

      const [inputs, setInputs] = useState({ left: [], right: [] });
      const [resultData, setResultData] = useState({ shown: false, isCorrect: false, errorMsg: '' });

      const startQuiz = (diff) => {
        setDifficulty(diff);
        const shuffled = [...baseQuizData[diff]].sort(() => Math.random() - 0.5).slice(0, QUIZ_LEN);
        setQuestions(shuffled);
        setCurrentIndex(0);
        setScore(0);
        setScreen('playing');
      };

      const updateKey = (v) => { setApiKey(v); saveKey(v.trim()); };

      const generateAI = async (diff) => {
        const useProxy = !!AI_PROXY_URL;
        const key = apiKey.trim();
        if (!useProxy && !key) {
          setAiError('AI新問を使うには、下の欄にGemini APIキーを入力してください。');
          return;
        }
        setAiError('');
        setIsLoading(true);

        const diffLabel = { beginner: '初級（係数合わせのみ）', intermediate: '中級（係数＋化学式の選択）', advanced: '上級（反応式を自分で立式。工業的製法を含む）' }[diff];
        const prompt = `高校化学の化学反応式問題を${AI_COUNT}問作成してください。互いに異なる反応を選ぶこと。
次のJSON配列のみを出力してください（マークダウン・コメント不要）。
各反応式は必ず原子数が両辺で一致し、係数は最小の整数比にすること。化学式は H2O, Ca(OH)2 のように半角英数字で書くこと。左辺・右辺とも物質は最大4つまで。
[
  {
    "title": "タイトル",
    "text": "問題文",
    "left": [{"formula": "化学式", "coeff": 1}],
    "right": [{"formula": "化学式", "coeff": 1}],
    "choices": ["化学式1", "化学式2"],
    "explanation": "解説"
  }
]
"choices" は中級のときのみ含め、正解の化学式とダミーの化学式を混ぜること。
難易度: ${diffLabel}`;

        let lastErr = '';
        const attempts = useProxy ? ['proxy'] : GEMINI_MODELS;
        for (const model of attempts) {
          try {
            let text = '';
            if (useProxy) {
              const res = await fetch(AI_PROXY_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ diff, count: AI_COUNT })
              });
              const data = await res.json().catch(() => ({}));
              if (!res.ok) { lastErr = data?.error || `通信エラー(${res.status})`; continue; }
              text = data.text || '';
            } else {
              const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
                body: JSON.stringify({
                  contents: [{ parts: [{ text: prompt }] }],
                  generationConfig: { responseMimeType: 'application/json' }
                })
              });
              const data = await res.json();
              if (!res.ok) {
                lastErr = `${model}: ${data?.error?.message || res.status}`;
                continue;
              }
              text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
            }
            const match = text.match(/\[[\s\S]*\]/);
            if (!match) { lastErr = '応答がJSON配列ではありません'; continue; }
            const qs = sanitizeAiQuestions(JSON.parse(match[0]), diff);
            if (qs.length === 0) { lastErr = '有効な問題がありませんでした'; continue; }
            setDifficulty(diff);
            setQuestions(qs);
            setCurrentIndex(0);
            setScore(0);
            setIsLoading(false);
            setScreen('playing');
            return;
          } catch (e) {
            lastErr = e.message;
          }
        }
        setIsLoading(false);
        setAiError(`AI生成に失敗しました（${lastErr}）。通常問題で練習できます。`);
      };

      useEffect(() => {
        if (screen === 'playing' && questions.length > 0) {
          const current = questions[currentIndex];
          if (!current) return;
          setResultData({ shown: false, isCorrect: false, errorMsg: '' });
          setHasAttempted(false);

          if (difficulty === 'beginner') {
            setInputs({
              left: current.left.map(t => ({ coeff: '', formula: t.formula })),
              right: current.right.map(t => ({ coeff: '', formula: t.formula }))
            });
          } else if (difficulty === 'intermediate') {
            setInputs({
              left: current.left.map(() => ({ coeff: '', formula: '' })),
              right: current.right.map(() => ({ coeff: '', formula: '' }))
            });
          } else {
            setInputs({
              left: Array.from({ length: Math.max(3, current.left.length) }, () => ({ coeff: '', formula: '' })),
              right: Array.from({ length: Math.max(3, current.right.length) }, () => ({ coeff: '', formula: '' }))
            });
          }
        }
      }, [screen, currentIndex, questions]);

      const handleInput = (side, index, field, value) => {
        setInputs(prev => {
          const newSide = [...prev[side]];
          newSide[index] = { ...newSide[index], [field]: value };
          return { ...prev, [side]: newSide };
        });
      };

      const check = () => {
        const current = questions[currentIndex];

        if (difficulty !== 'advanced') {
          const lOk = inputs.left.every(t => String(t.coeff).trim() !== '' && t.formula.trim() !== '');
          const rOk = inputs.right.every(t => String(t.coeff).trim() !== '' && t.formula.trim() !== '');
          if (!lOk || !rOk) {
            setResultData({ shown: false, isCorrect: false, errorMsg: 'すべての空欄を埋めてください（係数1も「1」を入力）。' });
            return;
          }
        } else {
          const hasPart = [...inputs.left, ...inputs.right].some(
            t => (String(t.coeff).trim() !== '' && t.formula.trim() === '') || (String(t.coeff).trim() === '' && t.formula.trim() !== '')
          );
          if (hasPart) {
            setResultData({ shown: false, isCorrect: false, errorMsg: '係数と化学式の片方しか入力されていない枠があります。' });
            return;
          }
        }

        const parse = (terms) => {
          return terms
            .filter(t => String(t.coeff).trim() !== '' && t.formula.trim() !== '')
            .map(t => ({
              coeff: parseInt(toHalf(String(t.coeff)), 10),
              formula: toHalf(t.formula.trim())
            }))
            .sort((a, b) => a.formula.localeCompare(b.formula));
        };

        const eq = (a, b) => {
          if (a.length !== b.length) return false;
          return a.every((item, i) => item.coeff === b[i].coeff && item.formula.toUpperCase() === b[i].formula.toUpperCase());
        };

        const isCorrect = eq(parse(inputs.left), parse(current.left)) && eq(parse(inputs.right), parse(current.right));

        setResultData({ shown: true, isCorrect, errorMsg: '' });
        if (isCorrect && !hasAttempted) setScore(s => s + 1);
        setHasAttempted(true);
      };

      // --- 画面レンダリング ---
      if (screen === 'home') {
        return (
          <div className="flex-grow flex items-center justify-center p-4">
            <div className="bg-white rounded-2xl shadow-xl p-6 sm:p-8 max-w-md w-full text-center border-t-8 border-teal-500">
              <div className="text-teal-500 text-5xl mb-3"><i className="fa-solid fa-flask"></i></div>
              <h1 className="text-2xl font-black text-slate-800 mb-2">化学 反応式マスター</h1>
              <p className="text-slate-600 text-sm mb-6">化学反応式をマスターして基礎固めをしよう！</p>

              {isLoading ? (
                <div className="py-10 text-teal-600 font-bold animate-pulse">
                  <i className="fa-solid fa-spinner fa-spin mr-2"></i>AIが問題を作成中...
                </div>
              ) : (
                <div className="space-y-3">
                  <div className="p-3 bg-emerald-50 border-2 border-emerald-500 rounded-xl text-left">
                    <div className="text-emerald-700 font-bold">初級 (係数合わせ)</div>
                    <div className="flex gap-2 mt-2">
                      <button onClick={() => startQuiz('beginner')} className="flex-1 py-1.5 bg-emerald-600 text-white font-bold rounded-lg text-sm">練習</button>
                      <button onClick={() => generateAI('beginner')} className="flex-1 py-1.5 bg-white text-emerald-700 border border-emerald-600 font-bold rounded-lg text-sm">✨AI新問</button>
                    </div>
                  </div>

                  <div className="p-3 bg-blue-50 border-2 border-blue-500 rounded-xl text-left">
                    <div className="text-blue-700 font-bold">中級 (係数＋化学式選択)</div>
                    <div className="flex gap-2 mt-2">
                      <button onClick={() => startQuiz('intermediate')} className="flex-1 py-1.5 bg-blue-600 text-white font-bold rounded-lg text-sm">練習</button>
                      <button onClick={() => generateAI('intermediate')} className="flex-1 py-1.5 bg-white text-blue-700 border border-blue-600 font-bold rounded-lg text-sm">✨AI新問</button>
                    </div>
                  </div>

                  <div className="p-3 bg-purple-50 border-2 border-purple-500 rounded-xl text-left">
                    <div className="text-purple-700 font-bold">上級 (反応式の立式)</div>
                    <div className="flex gap-2 mt-2">
                      <button onClick={() => startQuiz('advanced')} className="flex-1 py-1.5 bg-purple-600 text-white font-bold rounded-lg text-sm">練習</button>
                      <button onClick={() => generateAI('advanced')} className="flex-1 py-1.5 bg-white text-purple-700 border border-purple-600 font-bold rounded-lg text-sm">✨AI新問</button>
                    </div>
                  </div>

                  {aiError && (
                    <div className="text-left text-xs text-rose-600 bg-rose-50 border border-rose-200 rounded-lg p-2">
                      <i className="fa-solid fa-triangle-exclamation mr-1"></i>{aiError}
                    </div>
                  )}

                  {!AI_PROXY_URL && (
                  <details className="text-left text-xs text-slate-500 pt-1">
                    <summary className="cursor-pointer font-bold">AI新問の設定（Gemini APIキー）</summary>
                    <input
                      type="password"
                      className="mt-2 w-full border-2 border-slate-300 rounded-lg px-2 py-1.5 text-sm focus:border-teal-500 outline-none"
                      placeholder="APIキーを貼り付け"
                      value={apiKey}
                      onChange={(e) => updateKey(e.target.value)}
                      autoComplete="off"
                    />
                    <p className="mt-1">キーはこのブラウザ内にだけ保存されます。「練習」ボタンはキー無しで使えます。</p>
                  </details>
                  )}
                </div>
              )}
            </div>
          </div>
        );
      }

      if (screen === 'result') {
        return (
          <div className="flex-grow flex items-center justify-center p-4">
            <div className="bg-white rounded-2xl shadow-xl p-8 max-w-sm w-full text-center border-t-8 border-teal-500">
              <div className="text-yellow-500 text-5xl mb-3"><i className="fa-solid fa-trophy"></i></div>
              <h2 className="text-xl font-bold mb-2">結果発表</h2>
              <div className="text-4xl font-black mb-4">{score} / {questions.length}</div>
              {questions[0] && String(questions[0].id).startsWith('ai') && (
                <details className="text-left text-xs text-slate-500 mb-4">
                  <summary className="cursor-pointer font-bold">このAI問題を保存用にコピー</summary>
                  <p className="mt-2">下の文章をコピーして、Claudeに貼り付けるか、問題データに追加してください。この画面を閉じるとAI問題は消えます。</p>
                  <textarea
                    readOnly
                    className="mt-2 w-full h-40 border-2 border-slate-300 rounded-lg p-2 text-xs font-mono"
                    value={buildExport(questions, difficulty)}
                    onFocus={(e) => e.target.select()}
                  />
                </details>
              )}
              <button onClick={() => setScreen('home')} className="w-full py-3 bg-teal-600 text-white font-bold rounded-xl shadow">ホームへ戻る</button>
            </div>
          </div>
        );
      }

      const current = questions[currentIndex];
      if (!current) return null;

      return (
        <div className="flex-grow flex flex-col max-w-3xl w-full mx-auto p-4">
          <div className="flex justify-between items-center mb-4">
            <button onClick={() => setScreen('home')} className="bg-white px-3 py-1.5 rounded-lg shadow-sm border text-sm font-bold">
              <i className="fa-solid fa-house mr-1"></i>ホーム
            </button>
            <div className="text-teal-700 font-bold bg-teal-100 px-3 py-1 rounded-lg text-sm">スコア: {score}</div>
          </div>

          <div className="bg-white rounded-2xl shadow-md p-5 mb-5 border-l-4 border-teal-500">
            <div className="text-xs font-bold text-teal-600 mb-1">Q {currentIndex + 1} / {questions.length}</div>
            {current.title && <h3 className="font-bold text-base sm:text-lg text-slate-800 mb-2">{current.title}</h3>}
            <p className="text-slate-700 text-sm sm:text-base leading-relaxed">{current.text}</p>
            {difficulty === 'intermediate' && (
              <div className="mt-3 text-sm bg-blue-50 border border-blue-200 rounded-lg px-3 py-2 text-blue-800">
                <span className="font-bold mr-2">ヒント（関係する物質）</span>
                {Array.from(new Set([...current.left, ...current.right].map(t => t.formula))).sort().map(f => (
                  <span key={f} className="inline-block mr-3 font-bold text-base">{fmtForm(f)}</span>
                ))}
              </div>
            )}
          </div>

          <div className="bg-slate-50 rounded-2xl shadow-inner border p-4 mb-5 overflow-x-auto">
            <div className="flex items-center justify-center gap-2 min-w-max mx-auto">
              <div className="flex items-center gap-2 bg-white/70 p-2 rounded-xl border">
                {inputs.left.map((t, i) => (
                  <Fragment key={`l-${i}`}>
                    {i > 0 && <span className="font-black text-slate-400">+</span>}
                    <TermInput coeff={t.coeff} formula={t.formula} onCoeffChange={v => handleInput('left', i, 'coeff', v)} onFormulaChange={v => handleInput('left', i, 'formula', v)} difficulty={difficulty} choices={current.choices} disabled={resultData.shown} />
                  </Fragment>
                ))}
              </div>

              <div className="text-2xl font-black text-teal-500 mx-2"><i className="fa-solid fa-arrow-right"></i></div>

              <div className="flex items-center gap-2 bg-white/70 p-2 rounded-xl border">
                {inputs.right.map((t, i) => (
                  <Fragment key={`r-${i}`}>
                    {i > 0 && <span className="font-black text-slate-400">+</span>}
                    <TermInput coeff={t.coeff} formula={t.formula} onCoeffChange={v => handleInput('right', i, 'coeff', v)} onFormulaChange={v => handleInput('right', i, 'formula', v)} difficulty={difficulty} choices={current.choices} disabled={resultData.shown} />
                  </Fragment>
                ))}
              </div>
            </div>
          </div>

          {resultData.errorMsg && (
            <div className="mb-4 text-center text-rose-600 font-bold bg-rose-50 p-3 rounded-xl border border-rose-200 text-sm">
              <i className="fa-solid fa-triangle-exclamation mr-1"></i>{resultData.errorMsg}
            </div>
          )}

          {!resultData.shown ? (
            <button onClick={check} className="w-full py-3.5 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-xl shadow-lg">判定する</button>
          ) : (
            <div className={`rounded-2xl p-5 border-2 ${resultData.isCorrect ? 'bg-emerald-50 border-emerald-500' : 'bg-rose-50 border-rose-500'}`}>
              <h3 className={`text-lg font-bold mb-2 ${resultData.isCorrect ? 'text-emerald-700' : 'text-rose-700'}`}>
                {resultData.isCorrect ? '🎉 正解！' : '❌ 不正解'}
              </h3>
              <p className="text-sm text-slate-700 mb-4">{current.explanation}</p>
              <div className="bg-white p-3 rounded-xl border mb-4 text-center">
                <div className="text-xs text-slate-400 mb-1 font-bold">【正しい化学反応式】</div>
                {renderEq(current.left, current.right)}
              </div>
              <div className="flex gap-2">
                {!resultData.isCorrect && (
                  <button onClick={() => setResultData({ shown: false, isCorrect: false, errorMsg: '' })} className="flex-1 py-2.5 bg-white border border-rose-400 text-rose-600 font-bold rounded-xl">やり直す</button>
                )}
                <button onClick={() => currentIndex + 1 < questions.length ? setCurrentIndex(i => i + 1) : setScreen('result')} className="flex-1 py-2.5 bg-teal-600 text-white font-bold rounded-xl">
                  {currentIndex + 1 < questions.length ? '次の問題へ' : '結果を見る'}
                </button>
              </div>
            </div>
          )}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
